# Minimal nginx.conf for Windows

# Define the number of worker processes
worker_processes  auto;

# Set error log file to an absolute path; ensure the "logs" folder exists.
error_log  D:/MIU/25S-Y3S2/SPM/proj/Qr-Code-Generator/logs/error.log;
pid        D:/MIU/25S-Y3S2/SPM/proj/Qr-Code-Generator/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
  
    client_body_temp_path D:\\MIU\\25S-Y3S2\\SPM\\proj\\Qr-Code-Generator\\temp;
     include C:\\nginx-1.26.2\\conf\\mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server {
         listen       80;
         server_name  www.danielmichel.ddns.net;

         # Root directory for your website files.
         root  D:/MIU/25S-Y3S2/SPM/proj/Qr-Code-Generator;
         index Views/index.html;

        


         location / {
             try_files $uri $uri/ =404;
         }

        location ~* \.(css|js|woff|woff2|ttf|otf|eot|svg|ttf|ico|png|jpg|jpeg|gif|webp)$ {
             types {
                 text/css css;
                 application/javascript js;
                 image/png png;
                 image/jpeg jpg jpeg;
                 image/gif gif;
                 image/webp webp;
             }
         }

    }
}
